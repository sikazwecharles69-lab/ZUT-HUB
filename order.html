<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Place an Order | ZUT Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html#home" class="logo">ZUT <span>RESTAURANT</span></a>
        <nav class="main-navigation" aria-label="Main navigation">
            <a href="index.html#home">Home</a>
            <a href="index.html#menu">Menu</a>
            <a href="prices.html">Prices</a>
        </nav>
    </header>

    <main class="order-page">
        <section class="order-intro">
            <p class="eyebrow">ZUT RESTAURANT</p>
            <h1>Place an Order</h1>
            <p>Enter your details to send your order directly to the restaurant.</p>
        </section>

        <form class="order-form" id="order-form">
            <label for="customer-name">Your name</label>
            <input id="customer-name" name="customer_name" type="text" maxlength="120" autocomplete="name" required>

            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" required>

            <label for="order-type">Order type</label>
            <select id="order-type" name="order_type" required>
                <option value="takeaway">Takeaway</option>
                <option value="delivery">Delivery</option>
            </select>

            <div class="delivery-address-field" hidden>
                <label for="delivery-address">Delivery address</label>
                <textarea id="delivery-address" name="delivery_address" maxlength="300" rows="3" autocomplete="street-address"></textarea>
            </div>

            <label for="items">Items and quantities</label>
            <textarea id="items" name="items" maxlength="1000" rows="5" required
                      placeholder="For example: 2 x Chicken and Rice, 1 x Coca-Cola"></textarea>

            <label for="notes">Additional notes <span class="form-optional">(optional)</span></label>
            <textarea id="notes" name="notes" maxlength="1000" rows="3"></textarea>

            <button class="button order-submit" type="submit">Place Order</button>
        </form>

        <p id="order-status" class="order-notice" role="status" aria-live="polite" hidden></p>

        <p class="prices-back"><a class="button" href="index.html#menu">Back to Food Menu</a></p>
    </main>

    <footer>
        <p>Phone: <a href="tel:+260964442250">0964442250</a></p>
        <p>&copy; 2026 ZUT Restaurant. All rights reserved.</p>
    </footer>

    <script>
        const orderForm = document.querySelector("#order-form");
        const orderType = document.querySelector("#order-type");
        const addressField = document.querySelector("#delivery-address");
        const addressContainer = addressField.closest(".delivery-address-field");
        const itemsField = document.querySelector("#items");
        const statusMessage = document.querySelector("#order-status");
        const submitButton = orderForm.querySelector("button[type=submit]");

        const selectedItems = new URLSearchParams(window.location.search).get("items");
        if (selectedItems) itemsField.value = selectedItems;

        function updateDeliveryAddress() {
            const isDelivery = orderType.value === "delivery";
            addressField.required = isDelivery;
            addressContainer.hidden = !isDelivery;
        }

        orderType.addEventListener("change", updateDeliveryAddress);
        updateDeliveryAddress();

        orderForm.addEventListener("submit", event => {
            event.preventDefault();
            const data = new FormData(orderForm);
            statusMessage.hidden = false;
            statusMessage.className = "order-notice";
            statusMessage.textContent = "Sending your order…";
            submitButton.disabled = true;

            fetch("/api/order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(Object.fromEntries(data.entries())),
            })
                .then(async response => {
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(result.error || "We could not send your order.");
                    statusMessage.classList.add("order-notice-success");
                    statusMessage.textContent = `Your order was sent to the restaurant. Reference: ${result.orderReference}.`;
                    orderForm.reset();
                    itemsField.value = "";
                    updateDeliveryAddress();
                })
                .catch(error => {
                    statusMessage.classList.add("order-notice-error");
                    statusMessage.textContent = error.message || "We could not send your order. Please call the restaurant.";
                })
                .finally(() => {
                    submitButton.disabled = false;
                });
        });
    </script>
</body>
</html>
